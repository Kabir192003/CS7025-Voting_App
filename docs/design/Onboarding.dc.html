<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This or That — Pick topics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #4A6B9C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 22px 18px 18px; background: #EEF0F4; color: #14152B; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px">
    <div role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-label="Step 2 of 3" style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <span style="height: 4px; border-radius: 2px; background: #14152B"></span>
      <span style="height: 4px; border-radius: 2px; background: #14152B"></span>
      <span style="height: 4px; border-radius: 2px; background: #C9CCD9"></span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B5F7A">2 / 3</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 48px; line-height: 0.92">What do you have opinions about?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3D4160">Pick three or more. Your feed starts here and learns from how you vote.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{topics}}" as="t" hint-placeholder-count="12">
      <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">
        <span style="font-weight: 700; font-size: 15px">{{t.name}}</span>
        <span style="{{t.subStyle}}">{{t.example}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="{{ctaStyle}}">{{cta}}</button>
    <button type="button" style="background: transparent; border: 0; color: #3D4160; font-size: 14px; padding: 8px; min-height: 44px">Skip, show me everything</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { 'Tech': true, 'Money': true } };
  }
  renderVals() {
    var self = this;
    var defs = [
      ['Tech', 'Pixel or iPhone?'], ['Money', 'Save or invest?'], ['Career', 'Startup or big firm?'],
      ['Study', 'Notes by hand or typed?'], ['Travel', 'Window or aisle?'], ['Food & Drink', 'Flat white or cortado?'],
      ['Home', 'Cat or dog?'], ['Health', 'Gym at 7am or 7pm?'], ['Style', 'Trainers or boots?'],
      ['Relationships', 'Text back now or later?'], ['Entertainment', 'Book or series first?'], ['Everyday', 'Shower am or pm?']
    ];
    var count = 0;
    var topics = defs.map(function (d) {
      var on = !!self.state.picked[d[0]];
      if (on) count++;
      return {
        name: d[0], example: d[1], on: on ? 'true' : 'false',
        pick: function () { var p = Object.assign({}, self.state.picked); p[d[0]] = !p[d[0]]; self.setState({ picked: p }); },
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border-radius: 6px; padding: 11px 12px; min-height: 58px; ' + (on ? 'background: #4A6B9C; color: #FFFFFF; border: 1px solid #4A6B9C' : 'background: #FFFFFF; color: #14152B; border: 1px solid #DADCE6'),
        subStyle: 'font-size: 12px; ' + (on ? 'color: #F0F4FA' : 'color: #5B5F7A')
      };
    });
    var ready = count >= 3;
    return {
      topics: topics,
      cta: ready ? 'Build my feed · ' + count + ' topics' : 'Pick ' + (3 - count) + ' more',
      ctaStyle: 'border: 0; border-radius: 4px; padding: 15px; font-weight: 700; font-size: 16px; min-height: 52px; ' + (ready ? 'background: #14152B; color: #FFFFFF' : 'background: #C9CCD9; color: #3D4160')
    };
  }
}
</script>
</body>
</html>
